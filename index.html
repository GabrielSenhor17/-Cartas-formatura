<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f2">
<title>Uma lembrança para você</title>
<style>
:root{--bg:#f7f6f2;--paper:#fffefa;--ink:#292824;--muted:#77756e;--line:#e8e5dc;--accent:#b6a58c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.7}
.wrap{width:min(100% - 32px,680px);margin:0 auto;padding:38px 0 56px}
.top{text-align:center;color:var(--muted);font:11px/1.5 Arial,sans-serif;letter-spacing:.19em;text-transform:uppercase}
.card{background:var(--paper);border:1px solid var(--line);padding:clamp(24px,6vw,54px);margin-top:24px;box-shadow:0 10px 35px rgba(40,35,25,.035)}
h1{font-size:clamp(34px,8vw,54px);font-weight:400;line-height:1.12;text-align:center;margin:24px 0 10px}
.date{text-align:center;color:var(--muted);font:12px Arial,sans-serif;letter-spacing:.08em}
.rule{height:1px;background:var(--line);margin:30px 0}
h2{font-size:22px;font-weight:400;margin:0 0 12px}
p{font-size:17px;white-space:pre-wrap}
.message{font-size:17px}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.photos img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#eee;border-radius:2px}
.closing{text-align:center;font-size:24px;font-style:italic;margin:28px 0 6px}
.signature{text-align:center;color:var(--muted);font-size:15px}
.footer{text-align:center;color:var(--muted);font:11px Arial,sans-serif;letter-spacing:.1em;margin-top:24px}
.notice{text-align:center;padding:60px 18px;color:var(--muted);font-family:Arial,sans-serif}
.notice h1{font-family:Georgia,serif;color:var(--ink)}
@media(max-width:420px){.photos{grid-template-columns:1fr 1fr}.card{padding:24px 20px}}
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="top">04 de dezembro de 2026 · Uma lembrança</div>
  <article class="card">
    <div class="date">UMA CARTA FEITA ESPECIALMENTE PARA VOCÊ</div>
    <h1>Algumas pessoas<br>ficam na história.</h1>
    <p style="text-align:center;color:#77756e">Carregando sua lembrança...</p>
  </article>
  <div class="footer">COM CARINHO, GABRIEL</div>
</main>
<script src="cartas.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const id = params.get("c");
  const data = window.CARTAS || {};
  const person = id && data[id];
  const app = document.getElementById("app");
  if(!person){
    app.innerHTML = '<section class="notice"><div class="top">04 de dezembro de 2026</div><h1>Uma lembrança para você.</h1><p>Este link ainda não tem uma carta cadastrada.<br>Confira se o QR Code está correto.</p><div class="footer">COM CARINHO, GABRIEL</div></section>';
    return;
  }
  const safe = s => String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const photos = (person.photos || []).filter(Boolean).map(src => '<img src="'+safe(src)+'" alt="Uma lembrança" loading="lazy">').join("");
  app.innerHTML = `
    <div class="top">04 de dezembro de 2026 · Uma lembrança</div>
    <article class="card">
      <div class="date">UMA CARTA FEITA ESPECIALMENTE PARA VOCÊ</div>
      <h1>Para ${safe(person.name)}.</h1>
      <div class="date">Com carinho, Gabriel</div>
      <div class="rule"></div>
      <h2>O que você representa para mim</h2>
      <p class="message">${safe(person.message)}</p>
      ${photos ? '<div class="rule"></div><h2>Nossas lembranças</h2><div class="photos">'+photos+'</div>' : ''}
      <div class="rule"></div>
      <div class="closing">${safe(person.closing || "Obrigado por fazer parte da minha história.")}</div>
      <div class="signature">Com carinho,<br>Gabriel.</div>
    </article>
    <div class="footer">UMA PARTE DA NOSSA HISTÓRIA · 9º ANO</div>`;
})();
</script>
</body>
</html>
