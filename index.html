
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma carta especial 🤍</title>

  <style>
    :root {
      --scene: #873744;
      --signature: #F5CF45;
      --paper: #FFF9F0;
      --ink: #171717;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      background: var(--scene);
      color: var(--ink);
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      width: 100%;
      max-width: 650px;
    }

    .instagram {
      text-align: center;
      margin-bottom: 18px;
      font-family: Arial, sans-serif;
    }

    .instagram a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .card {
      background: var(--paper);
      border-radius: 18px;
      padding: 35px 25px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 35px #0003;
      border: 1px solid #ffffff80;
    }

    .decoration {
      height: 5px;
      width: 75px;
      border-radius: 20px;
      background: var(--scene);
      margin: 0 auto 25px;
      position: relative;
    }

    .decoration::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 5px;
      border-radius: 20px;
      background: var(--signature);
      right: -27px;
      top: 0;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin: 0 0 28px;
      color: var(--ink);
    }

    .message {
      font-size: 17px;
      line-height: 1.85;
      white-space: pre-line;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .closing {
      margin-top: 30px;
      line-height: 1.8;
      font-size: 17px;
    }

    .signature {
      display: inline-block;
      margin-top: 8px;
      color: var(--signature);
      font-weight: bold;
      font-size: 21px;
    }

    .bottom-decoration {
      text-align: center;
      margin-top: 28px;
      color: var(--scene);
      letter-spacing: 8px;
      font-size: 15px;
    }

    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 25px;
    }

    .photos img {
      width: 100%;
      border-radius: 10px;
      object-fit: cover;
    }

    .error {
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 24px;
      }

      .message {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="instagram">
      <a href="https://www.instagram.com/gabriel_.az7/"
         target="_blank" rel="noopener noreferrer">
        @gabriel_.az7
      </a>
    </div>

    <div id="content"></div>
  </main>

  <script src="cartas.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("c");
    const person = window.CARTAS?.[id];
    const content = document.getElementById("content");

    function safeColor(value, fallback) {
      return /^#[0-9a-fA-F]{6}$/.test(value || "")
        ? value
        : fallback;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    if (!person) {
      content.innerHTML = `
        <div class="error">
          <h2>Esta carta não foi encontrada.</h2>
          <p>Confira se o link está correto.</p>
        </div>
      `;
    } else {
      document.documentElement.style.setProperty(
        "--scene",
        safeColor(person.backgroundColor, "#873744")
      );

      document.documentElement.style.setProperty(
        "--signature",
        safeColor(person.signatureColor, "#F5CF45")
      );

      const photos = (person.photos || [])
        .map(url => `
          <img src="${escapeHTML(url)}" alt="Foto especial">
        `).join("");

      content.innerHTML = `
        <section class="card">
          <div class="decoration"></div>

          <h1>Para ${escapeHTML(person.name)} 🤍</h1>

          <div class="message">
            ${escapeHTML(person.message)}
          </div>

          <div class="closing">
            ${escapeHTML(person.closingText || "")}
            <br>
            <span class="signature">
              ${escapeHTML(person.signature || "Cuscuz 🤍")}
            </span>
          </div>

          ${photos ? `<div class="photos">${photos}</div>` : ""}

          <div class="bottom-decoration">✦ · ✧ · ✦</div>
        </section>
      `;
    }
  </script>
</body>
</html>
